<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@pornovirtuale.com
    ServerName pornovirtuale.com
    ServerAlias www.pornovirtuale.com
    DocumentRoot /var/www/pornovirtuale

    # Vecchi indirizzi del sito precedente: Googlebot li chiede ancora e prendevano 404
    # (circa metà della crawl). 301 verso la home invece di sprecare la scansione.
    RedirectMatch 301 ^/tx/.*$ /
    RedirectMatch 301 ^/block/.*$ /
    RedirectMatch 301 ^/video/.*$ /
    RedirectMatch 301 ^/2024/.*$ /
    RedirectMatch 301 ^/tag/.*$ /
    RedirectMatch 301 ^/autorefresh/?$ /
    RedirectMatch 301 ^/gallery(/.*)?$ /
    RedirectMatch 301 ^/governance/?$ /
    RedirectMatch 301 ^/stanze/.*$ /
    RedirectMatch 301 ^/stanze$ /
    RedirectMatch 301 ^/[0-9]+/?$ /
    RedirectMatch 301 ^/\d{9,}\.shtml$ /

    # HTTP/2 + modern TLS
    Protocols h2 http/1.1
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml
    </IfModule>

    <Directory /var/www/pornovirtuale>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Header di sicurezza lato server
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    </IfModule>

    # Nasconde la versione di Apache (impostazione globale in conf-available/security.conf)

    ErrorLog ${APACHE_LOG_DIR}/pornovirtuale_error.log
    CustomLog ${APACHE_LOG_DIR}/pornovirtuale_access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/pornovirtuale.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pornovirtuale.com/privkey.pem
</VirtualHost>
</IfModule>
