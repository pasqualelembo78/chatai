apply plugin: 'com.android.application'

android {
    namespace 'com.intelligame.chatadmin'
    compileSdk 35

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'Ch4tA1_R3l34s3!'
            keyAlias 'chatai'
            keyPassword 'Ch4tA1_R3l34s3!'
        }
    }

    defaultConfig {
        applicationId 'com.intelligame.chatadmin'
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 2
        versionName "1.1"
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    packaging {
        resources {
            excludes += ['META-INF/kotlin-stdlib-jdk7.kotlin_module',
                         'META-INF/kotlin-stdlib-jdk8.kotlin_module']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
